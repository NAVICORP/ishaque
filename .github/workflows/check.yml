name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - name: Smoke test the built site
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          PORTFOLIO_URL=http://127.0.0.1:4173 npm run check
      - name: Smoke test the Node server with the API
        run: |
          mkdir -p /tmp/ishaque-data
          DATA_DIR=/tmp/ishaque-data PORT=8090 node server/site.mjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/api/stats >/dev/null && break; sleep 1; done
          PORTFOLIO_URL=http://127.0.0.1:8090 npm run check

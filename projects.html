<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ec">
  <meta name="description" content="<!--@count-all--> projects by Ishaque Nv. and SkiFi: pitch decks, product design, websites, brands, one-pagers and brochures.">
  <link rel="canonical" href="https://ishaquenv.com/projects">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ishaque Nv.">
  <meta property="og:url" content="https://ishaquenv.com/projects">
  <meta property="og:title" content="Projects | Ishaque Nv.">
  <meta property="og:description" content="Pitch decks, product design, websites and brands built to move people to act.">
  <meta property="og:image" content="https://ishaquenv.com/assets/portfolio/projects-og-image.png?v=20260827-2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Projects | Ishaque Nv.">
  <meta name="twitter:description" content="Pitch decks, product design, websites and brands built to move people to act.">
  <meta name="twitter:image" content="https://ishaquenv.com/assets/portfolio/projects-og-image.png?v=20260827-2">
  <title>Projects | Ishaque Nv.</title>
  <link rel="icon" href="/assets/portfolio/ishaque-headshot.jpg" type="image/jpeg">
  <script>try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="projects-page">
  <a class="skip-link" href="#main">Skip to content</a>

  <a class="logo-pill" href="/" aria-label="Ishaque Nv., home">
    <img src="/assets/portfolio/ishaque-headshot.jpg" alt="" width="36" height="36">
    <span>Ishaque Nv.</span>
  </a>
  <div class="top-right">
    <p class="visits" data-visits hidden><i aria-hidden="true"></i><b data-visits-count></b> visitors</p>
    <button class="theme-pill" type="button" data-theme-toggle aria-label="Switch to night">
    <span class="theme-icon" aria-hidden="true">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
    </span>
    <span class="theme-word" data-theme-word>Night</span>
  </button>
  </div>

  <nav class="dock" aria-label="Primary" data-dock>
    <span class="dock-ind" aria-hidden="true" data-dock-ind></span>
    <a class="dock-home" href="/" aria-label="Home"><img src="/assets/portfolio/ishaque-headshot.jpg" alt="" width="26" height="26"></a>
    <a class="dock-wide" href="/#journey">Journey</a>
    <a href="/#work">Work</a>
    <a href="/projects" aria-current="page">Projects</a>
    <a href="/#contact">Contact</a>
    <span class="dock-sep" aria-hidden="true"></span>
    <a class="dock-cta" href="/assets/portfolio/Muhammed-Ishaque-CV.pdf" download="Muhammed-Ishaque-CV.pdf">Resume <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg></a>
  </nav>

  <main id="main">
    <section class="projects-head wrap" aria-labelledby="projects-title">
      <h1 id="projects-title">Projects <span class="count-badge"><!--@count-all--></span></h1>
      <div class="projects-tools">
        <div class="chip-row" role="group" aria-label="Filter by category" data-filters>
<!--@projects-filters-->
        </div>
        <label class="search" for="project-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <span class="visually-hidden">Search projects</span>
          <input id="project-search" type="search" placeholder="Search by client or industry" autocomplete="off" data-search>
        </label>
      </div>
    </section>

    <section class="wrap grid-wrap" aria-label="All projects">
      <div class="work-grid" data-grid>
<!--@projects-grid-->
      </div>
      <p class="grid-empty" data-empty hidden>Nothing matches that search. Try a client name or an industry, or clear the filter.</p>
      <div class="grid-more">
        <p data-grid-status role="status" aria-live="polite"></p>
        <button class="btn-ghost" type="button" data-more hidden>Show more</button>
      </div>
    </section>

    <section class="hello hello-short torn" aria-labelledby="cta-title">
      <div class="wrap hello-inner">
        <h2 id="cta-title">Yours could be next.</h2>
        <div class="hello-actions">
          <a class="btn-sun" href="/#contact">Start a project</a>
        </div>
      </div>
      <div class="clouds-foot" aria-hidden="true"><img src="/assets/scene/clouds-foot.webp" alt="" width="2000" height="416" loading="lazy"></div>
      <footer class="foot wrap">
        <span>© 2026 Ishaque Nv.</span>
        <a href="mailto:ishaque@skifi.co">ishaque@skifi.co</a>
      </footer>
    </section>
  </main>

  <dialog class="sheet project-sheet" data-quick-view aria-labelledby="qv-title">
    <div class="sheet-top">
      <span class="tag" data-qv-tag></span>
      <button class="x" type="button" data-qv-close aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="qv-media media" data-qv-media></div>
    <h2 id="qv-title" data-qv-title></h2>
    <p class="role" data-qv-role></p>
    <p class="lead" data-qv-summary></p>
    <ul class="did" data-qv-outcome></ul>
    <div class="row">
      <div class="row-links" data-qv-actions></div>
      <div class="row-nav">
        <button class="round" type="button" data-qv-prev aria-label="Previous project"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></button>
        <button class="round" type="button" data-qv-next aria-label="Next project"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
      </div>
    </div>
  </dialog>

  <div class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/script.js"></script>
</body>
</html>
